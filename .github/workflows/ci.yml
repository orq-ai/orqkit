name: CI

on:
  push:
    branches: [main]
  pull_request:

# For PRs, cancel previous runs. For main branch, queue them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Python for wire compatibility checks
        if: ${{ hashFiles('packages/evaluatorq/src/lib/common/python-config-keys.ts') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Python reference
        if: ${{ hashFiles('packages/evaluatorq/src/lib/common/python-config-keys.ts') != '' }}
        run: python -m pip install "evaluatorq==1.85.0"

      - name: Verify generated contracts and Python loading
        if: ${{ hashFiles('packages/evaluatorq/src/lib/common/python-config-keys.ts') != '' }}
        env:
          EVALUATORQ_PYTHON: python
        run: bun test packages/evaluatorq/tests/lib/python-generator-freshness.spec.ts packages/evaluatorq/tests/lib/python-load-interop.spec.ts

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Check code quality with Biome
        run: bun biome check

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        id: setSHAs
        uses: nrwl/nx-set-shas@v4

      - name: Show affected base and head
        run: |
          echo "BASE: ${{ steps.setSHAs.outputs.base }}"
          echo "HEAD: ${{ steps.setSHAs.outputs.head }}"

      - name: Run affected typecheck, build and tests
        run: bun nx affected --target=typecheck,build,test --base=${{ steps.setSHAs.outputs.base }} --parallel=1 --outputStyle=stream
